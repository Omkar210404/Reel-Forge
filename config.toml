# ReelForge settings. Every key is optional; missing keys fall back to built-in defaults.

[voice]
name = "en-US-AndrewMultilingualNeural"   # any edge-tts voice: `edge-tts --list-voices`
rate = "+5%"                               # speaking speed, e.g. "-10%", "+0%", "+15%"
whisper_model = "base.en"                  # faster-whisper model used for word timing

[video]
width = 1080
height = 1920
fps = 30

[background]
mode = "pexels"          # pexels | gradient | image  (pexels falls back to gradient without a key)
image = ""               # used when mode = "image" (Ken Burns pan/zoom on this picture)
max_beat_seconds = 6.0   # a new visual starts at least this often
darken = 0.35            # 0..1, dims stock footage/images so captions stay readable

[captions]
style = "highlight"      # highlight (word-by-word colour) | pop (whole phrase pops in)
words_per_group = 3
font = ""                # path to a .ttf/.otf; empty = first bold system font found
size = 92
color = "#FFFFFF"
highlight_color = "#FFD60A"
stroke_color = "#000000"
stroke_width = 8
position = 0.62          # vertical centre of captions, 0 = top, 1 = bottom
uppercase = true

[music]
folder = "assets/music"  # first .mp3 found here is used; none = no music
volume = 0.25            # music level before ducking (0..1)
duck = true              # lower the music while the voice is speaking
