# ReelForge settings. Every key is optional; missing keys fall back to built-in defaults.

[voice]
name = "en-US-AndrewMultilingualNeural"   # any edge-tts voice: `edge-tts --list-voices`
rate = "+5%"                               # speaking speed, e.g. "-10%", "+0%", "+15%"
whisper_model = "base.en"                  # faster-whisper model used for word timing

[video]
width = 1080
height = 1920
fps = 30
max_seconds = 90         # reels longer than this are refused

[background]
# auto     = Pexels stock video if PEXELS_API_KEY is set, otherwise free AI images
# pexels   = stock video per sentence (AI image when a search finds nothing)
# ai       = free AI image per sentence (Pollinations, no key, ~45 s per image)
# gradient = animated colour gradients (fully offline, fastest)
# image    = slow pan/zoom on your own picture
mode = "auto"
art_style = "cartoon"    # AI pictures: cartoon (3D Pixar-style, recurring character) | photo
image = ""
max_beat_seconds = 6.0   # a new visual starts at least this often
darken = 0.2             # 0..1, dims footage/images so captions stay readable
director_model = "llama3.2:3b"            # local Ollama model that plans each scene; "" = keywords only
ollama_url = "http://127.0.0.1:11434"
ai_fallback = true       # in pexels mode, use an AI image when no stock clip matches
ai_min_interval = 45     # seconds between free AI image requests

[captions]
style = "highlight"      # highlight (word-by-word colour) | pop (whole phrase pops in)
words_per_group = 3
font = ""                # path to a .ttf/.otf; empty = first bold system font found
size = 92
color = "#FFFFFF"
highlight_color = "#FFD60A"
stroke_color = "#000000"
stroke_width = 8
position = 0.62          # vertical centre of captions, 0 = top, 1 = bottom
uppercase = true

[music]
folder = "assets/music"  # first .mp3 found here is used; none = no music
volume = 0.25            # music level before ducking (0..1)
duck = true              # lower the music while the voice is speaking
